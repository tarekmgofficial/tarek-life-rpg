<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tarek Life RPG — Test</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@500;700&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #09090f;
    color: #dde4ee;
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .container { width: 100%; max-width: 480px; padding: 20px; }
  .panel {
    background: #0e1018;
    border: 1px solid #1a2035;
    padding: 28px;
    position: relative;
  }
  .corner { position: absolute; width: 10px; height: 10px; }
  .tl { top: -1px; left: -1px; border-top: 2px solid #00d4ff; border-left: 2px solid #00d4ff; }
  .tr { top: -1px; right: -1px; border-top: 2px solid #00d4ff; border-right: 2px solid #00d4ff; }
  .bl { bottom: -1px; left: -1px; border-bottom: 2px solid #00d4ff; border-left: 2px solid #00d4ff; }
  .br { bottom: -1px; right: -1px; border-bottom: 2px solid #00d4ff; border-right: 2px solid #00d4ff; }
  .label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #00d4ff;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0.7;
  }
  .player-name {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #dde4ee;
    margin-bottom: 6px;
  }
  .player-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: #00d4ff;
    letter-spacing: 2px;
    margin-bottom: 24px;
    opacity: 0.8;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 0;
    border-bottom: 1px solid #1a2035;
  }
  .stat-row:last-of-type { border-bottom: none; }
  .stat-label {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: #7a90aa;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .stat-value {
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    font-weight: bold;
  }
  .gold { color: #f0c040; }
  .cyan { color: #00d4ff; }
  .green { color: #30cc70; }
  .red { color: #ff4060; }
  .status {
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    letter-spacing: 2px;
    margin-top: 20px;
    padding: 8px 12px;
    border: 1px solid #1a2035;
    color: #3d5068;
    text-align: center;
  }
  .status.loading { color: #00d4ff; border-color: #00d4ff; animation: pulse 1.5s infinite; }
  .status.success { color: #30cc70; border-color: #30cc70; }
  .status.error { color: #ff4060; border-color: #ff4060; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .config-box {
    background: #13161f;
    border: 1px solid #1a2035;
    padding: 20px;
    margin-bottom: 16px;
  }
  .config-box input {
    width: 100%;
    background: #09090f;
    border: 1px solid #1a2035;
    color: #dde4ee;
    font-family: 'Share Tech Mono', monospace;
    font-size: 12px;
    padding: 10px 12px;
    margin-top: 8px;
    outline: none;
    letter-spacing: 1px;
  }
  .config-box input:focus { border-color: #00d4ff; }
  .config-box input::placeholder { color: #3d5068; }
  .btn {
    width: 100%;
    background: transparent;
    border: 1px solid #00d4ff;
    color: #00d4ff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    padding: 12px;
    cursor: pointer;
    text-transform: uppercase;
    margin-top: 12px;
    transition: background 0.2s;
  }
  .btn:hover { background: rgba(0,212,255,0.1); }
  .btn:disabled { opacity: 0.3; cursor: not-allowed; }
</style>
</head>
<body>
<div class="container">

  <div class="config-box" id="configBox">
    <div class="label">System Initialisation</div>
    <div style="font-family:'Share Tech Mono',monospace;font-size:11px;color:#7a90aa;letter-spacing:1px;line-height:1.7">
      Enter your Anthropic API key to connect and load your live stats.
      The key is stored locally in your browser only.
    </div>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
    <button class="btn" onclick="saveKeyAndLoad()">INITIALISE SYSTEM</button>
  </div>

  <div class="panel" id="mainPanel" style="display:none">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <div class="label">PLAYER PROFILE — LIVE DATA</div>
    <div class="player-name" id="playerName">LOADING...</div>
    <div class="player-sub" id="playerTitle">SYNCING...</div>

    <div class="stat-row">
      <span class="stat-label">Current Weight</span>
      <span class="stat-value green" id="statWeight">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Target Weight</span>
      <span class="stat-value cyan" id="statTarget">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Global Level</span>
      <span class="stat-value gold" id="statLevel">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Active Projects</span>
      <span class="stat-value cyan" id="statProjects">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Job Status</span>
      <span class="stat-value red" id="statJob">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Last Sync</span>
      <span class="stat-value" id="statSync" style="color:#7a90aa;font-size:11px">--</span>
    </div>

    <div class="status loading" id="statusBar">CONNECTING...</div>
    <button class="btn" id="refreshBtn" onclick="loadData()" style="margin-top:12px">REFRESH DATA</button>
    <button class="btn" onclick="clearKey()" style="border-color:#1a2035;color:#3d5068;margin-top:6px">RESET API KEY</button>
  </div>

</div>

<script>
function saveKeyAndLoad() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-ant-')) {
    alert('That does not look like a valid Anthropic API key. It should start with sk-ant-');
    return;
  }
  localStorage.setItem('tarek_rpg_api_key', key);
  showMainPanel();
  loadData();
}

function clearKey() {
  localStorage.removeItem('tarek_rpg_api_key');
  document.getElementById('configBox').style.display = 'block';
  document.getElementById('mainPanel').style.display = 'none';
  document.getElementById('apiKeyInput').value = '';
}

function showMainPanel() {
  document.getElementById('configBox').style.display = 'none';
  document.getElementById('mainPanel').style.display = 'block';
}

function setStatus(msg, type) {
  const el = document.getElementById('statusBar');
  el.textContent = msg;
  el.className = 'status ' + type;
}

async function loadData() {
  const key = localStorage.getItem('tarek_rpg_api_key');
  if (!key) { clearKey(); return; }

  setStatus('SYNCING WITH NOTION...', 'loading');
  document.getElementById('refreshBtn').disabled = true;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6',
        max_tokens: 500,
        system: `You are a data extraction assistant. Return ONLY a valid JSON object with no markdown, no backticks, no explanation. Just raw JSON with these fields:
- name: full name
- title: main role in 4-6 words
- currentWeight: current weight as string e.g. "116.5kg"
- targetWeight: short-term target as string e.g. "100kg"
- globalLevel: RPG level 1-20 based on overall life progress
- activeProjects: number of active music projects as string e.g. "6 active"
- jobStatus: employment status in 4-5 words`,
        messages: [{
          role: 'user',
          content: `Extract the required JSON fields from this profile data:

Name: Tarek Ghanameh, 32, 180cm.
Weight: dropped from 120kg to 116.5kg (8 May 2026). Target: 100kg short term, 90kg long term.
Job: Made redundant from Incode 6 May 2026. Actively hunting SE or CSM role.
Music: Games and trailer composer TarekMG. Active pipeline: SkyRen (due 15 May), Caveshifter, Tamzin Twins, Yomifuda, Orbital, Soulcery, Bones and Coins. Mentor: Alex Pfeffer. Rate $300-400/min.
Business: Co-founder Ghost Note Accessories with Rashid.
Goals: 100kg, first paid game placement, Ghost Note 5-10 sales/week, clear £2k debt.

Return only the JSON object.`
        }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'API error ' + response.status);
    }

    const data = await response.json();
    const rawText = data.content[0].text.trim();

    let parsed;
    try {
      parsed = JSON.parse(rawText);
    } catch {
      const match = rawText.match(/\{[\s\S]*\}/);
      if (match) parsed = JSON.parse(match[0]);
      else throw new Error('Could not parse response');
    }

    document.getElementById('playerName').textContent = parsed.name || 'TAREK GHANAMEH';
    document.getElementById('playerTitle').textContent = (parsed.title || 'CREATOR / WARRIOR / COMPOSER').toUpperCase();
    document.getElementById('statWeight').textContent = parsed.currentWeight || '116.5kg';
    document.getElementById('statTarget').textContent = parsed.targetWeight || '100kg';
    document.getElementById('statLevel').textContent = 'LV ' + (parsed.globalLevel || '8');
    document.getElementById('statProjects').textContent = parsed.activeProjects || '6 active';
    document.getElementById('statJob').textContent = parsed.jobStatus || 'Hunting — redundant May 2026';
    document.getElementById('statSync').textContent = new Date().toLocaleTimeString();

    setStatus('NOTION SYNC COMPLETE', 'success');

  } catch (err) {
    console.error(err);
    setStatus('ERROR: ' + err.message, 'error');
  }

  document.getElementById('refreshBtn').disabled = false;
}

window.addEventListener('load', () => {
  const key = localStorage.getItem('tarek_rpg_api_key');
  if (key) { showMainPanel(); loadData(); }
});
</script>
</body>
</html>
